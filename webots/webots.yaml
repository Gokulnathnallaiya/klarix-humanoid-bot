# webots.yaml - configuration for Webots Cloud
# Place this at the repository root (or in the webots folder) so Webots Cloud can find
# the world file and controllers. After committing and pushing, use the blob URL in
# the Webots Cloud UI when adding a simulation.

name: klarix-humanoid-bot
description: NAO office demo for Klarix humanoid-bot
webots_version: R2023b

# Relative path to the world file inside your repository
world: webots/worlds/nao_office_demo.wbt

# Optional: define controllers so Webots Cloud knows how to start them
controllers:
  nao_office_assistant:
    language: python
    path: webots/controllers/nao_office_assistant
    startup: nao_office_assistant.py

# Optional: list Python requirements (Webots Cloud will try to install them)
# You can also put these in a requirements file and reference it here instead.
requirements:
  - pillow>=9.0.0
  - numpy
  - opencv-python-headless

# Notes:
# - Make sure your .wbt has a header indicating a supported Webots version, for example:
#   #VRML_SIM R2023b utf8
# - Ensure all texture and assets used by the world are included in the repo or use
#   accessible URLs. Webots Cloud clones the repo and runs the world from there.
# - If you need special OS-level packages or a custom Python runtime, check the
#   Webots Cloud docs for advanced configuration (or provide a Docker image).
